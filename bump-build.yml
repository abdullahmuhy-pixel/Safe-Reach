name: Bump BUILD in sw.js

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/**'
      - '*.md'

jobs:
  bump-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump BUILD constant in sw.js
        run: |
          TODAY=$(date -u +"%Y%m%d")

          # Read the current BUILD value from sw.js
          CURRENT=$(grep -oP "(?<=BUILD = ')[^']+" sw.js || echo "")
          echo "Current BUILD: $CURRENT"

          # If already today's date, increment the counter N
          if echo "$CURRENT" | grep -qP "^${TODAY}-\d+$"; then
            N=$(echo "$CURRENT" | grep -oP '\d+$')
            NEXT_N=$((N + 1))
            NEW_BUILD="${TODAY}-${NEXT_N}"
          else
            NEW_BUILD="${TODAY}-1"
          fi

          echo "New BUILD: $NEW_BUILD"
          sed -i "s/const BUILD = '[^']*'/const BUILD = '${NEW_BUILD}'/" sw.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "No changes" && exit 0
          git add sw.js
          git commit -m "chore: bump BUILD to $(grep -oP "(?<=BUILD = ')[^']+" sw.js) [skip ci]"
          git push
